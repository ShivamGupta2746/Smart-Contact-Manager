<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="Base::layout(~{::section})">
<head>
<meta charset="UTF-8">
<title th:text="${title}">About Page</title>
</head>
<body>
	<section>
	
	  <div id="login">
        
        <div class="container">
            <div id="login-row" class="row justify-content-center align-items-center">
                <div id="login-column" class="col-md-6">
                    <div id="login-box" style="height:220px;" class="col-md-12">
                        
                    


							<div th:if="${session.message}"
								class="alert alert-danger m-3 text-center" role="alert">
								<span th:text="${session.message}"></span>
							</div>

							<div th:if="${session.otp != null and session.message == null}"
								class="alert alert-success m-3 text-center" role="alert">
								We sent OTP to your Email</div>



							<form method="post" action="" th:action="@{/verify-otp}">
                        
                        <div class="form-group mx-3">
                        
                        <input name="otp" required="required" type="number" placeholder="Enter OTP Here" class="form-control" />
                        
                        
                        </div>
                        
                        <div class="container m-4 text-center">
                        		<button class="btn btn-success">Verify</button>
                        
                        </div>
                        
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    
	</section>
	
		

</body>
</html>
