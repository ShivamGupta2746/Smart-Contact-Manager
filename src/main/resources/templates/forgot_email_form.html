<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="Base::layout(~{::section})">
<head>
<meta charset="UTF-8">
<title th:text="${title}">About Page</title>
</head>
<body>
	<section>
	
	  <div id="login">
        
        <div class="container">
            <div id="login-row" class="row justify-content-center align-items-center">
                <div id="login-column" class="col-md-6">
                    <div id="login-box" style="height:220px;" class="col-md-12">
                        
                        <h3 class="text-center m-4">Your Registered Email</h3>
                      
                       
                        
                        <!-- Message Box -->
                        
                         <div th:if="${session.message}" class="container">
         			<div class="alert alert-danger text-center" role="alert">
 			 
 			 <span th:text="${session.message}"></span>
 			 
					</div>
					
					
         		</div>
                        
                        <form method="post" action="" th:action="@{/send-otp}">
                        
                        <div class="form-group mx-3">
                        
                        <input name="email" required="required" type="email" placeholder="Enter Your Email Here" class="form-control" />
                        
                        
                        </div>
                        
                        <div class="container m-4 text-center">
                        		<button class="btn btn-warning">Send OTP</button>
                        
                        </div>
                        
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    
	</section>
	
		

</body>
</html>
