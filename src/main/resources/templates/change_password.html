<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="Base::layout(~{::section})">
<head>
<meta charset="UTF-8">
<title th:text="${title}">Change Password</title>
</head>
<body>
	<section>
	
	  <div id="login">
        
        <div class="container">
            <div id="login-row" class="row justify-content-center align-items-center">
                <div id="login-column" class="col-md-6">
                    <div id="login-box" style="height:220px;" class="col-md-12">
                        
                        <h3 class="text-center m-4">Enter New Password</h3>
                      
                
                        <form method="post" action="" th:action="@{/change-password}">
                        
                        <div class="form-group mx-3">
                        
                        <input name="newpassword" required="required" type="password" placeholder="Enter Your New Password" class="form-control" />
                        
                        
                        </div>
                        
                        <div class="container m-4 text-center">
                        		<button class="btn btn-primary">Change Password</button>
                        
                        </div>
                        
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    
	</section>
	
		

</body>
</html>
