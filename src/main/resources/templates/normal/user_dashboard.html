<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="normal/Base::layout(~{::section})">
<head>
<meta charset="UTF-8">
<title th:text="${title}">About Page</title>
</head>
<body>
	
		<section>
				
				<div class="container">
					<div class="card">
						<div class="card-body">
						
				 <div class="container text-center">
			   	     	 
			   	     <img alt="profile photo" class="my_profile_picture" th:src="@{'/image/contact_logo.png'}" src="" style="height: 200px; width: 200px;">
			    
			   	  </div>
						
						<h1 class="text-center mt-3 text-secondary fst-italic font-wieght-light">
						Start Adding Your Contacts In Cloud...</h1>
						
						<div class="text-center mt-4">
						 <a th:href="@{/user/add-contact}" class="btn btn-primary w-100 text-uppercase">Add New Contact</a>
						 
						 <!--  For the payment integration   --> 
						 <hr/>
						 
						 <h3 class="my-3">Donate Us</h3>
						 <input id="payment_Field" type="text" class="form-control my-2" placeholder="Enter Amount Here"/>
						 <div class="container">
						 	<button onclick="paymentStart()" class="btn btn-success mt-4 w-100">CheckOut</button>
						 
						 </div>
						</div>
						
						</div>
					
					</div>
				
				</div>
				
				
				
				<script>
				
				$(document).ready(() =>{
					$(".item").removeClass("active");
					$("#home-link").addClass("active");
				});
				
				</script>
				
			
		</section>

</body>
</html>
