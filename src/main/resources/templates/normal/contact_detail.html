<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="normal/Base::layout(~{::section})">
<head>
<meta charset="UTF-8">
<title th:text="${title}">About Page</title>
</head>
<body>
	
		<section>
		<div class="card ms-3 me-3">
		
		<div class="card-body" th:if=${contact}>
			<div class="container text-center">
			 <img alt="profile photo" class="my_profile_picture" th:src="@{'/image/'+${contact.image}}" src="" style="height: 200px; width: 200px;">
			    
			    <h3 class="mt-3"><span th:text="${contact.name}"></span>(<span th:text="${contact.secondName}"></span>)</h3>
			
			
									<table class="table">
						  <thead>
						    <tr>
						      <th scope="col">#ID</th>
						      <th scope="col">SCM2025<span th:text="${contact.cId}"></span></th>
						    </tr>
						    
						  </thead>
						  
						  <tbody>
						  
						    <tr>
						      <th scope="row">Email</th>
						      <td><span th:text="${contact.email}"></span></td>      
						    </tr>
						    
						    <tr>
						      <th scope="row">Phone</th>
						      <td><span th:text="${contact.phone}"></span></td>      
						    </tr>
						    
						    <tr>
						      <th scope="row">Work</th>
						      <td><span th:text="${contact.work}"></span></td>      
						    </tr>
						    		    
						  </tbody>
						</table>
						
						<div class="description">
						  <th:block th:utext="${contact.description}"></th:block>
						
						</div>
						
				<div class="container mt-3">
						<button th:onclick="|deleteContact(${contact.cId})|" class="btn btn-danger w-100 btn-sm">Delete</button>
			      	
			      	    	<form method="post" th:action="@{'/user/update-contact/'+${contact.cId}}" class="mt-2">
			      	
			      	<button type="submit" class="btn btn-primary w-100 btn-sm">Update</button>
			      
			    	</form>
			    	
				</div>
			
			</div>
		
		 </div>
		 
		 <h3 th:unless="${contact}">You have don't permission to access this contact...</h3>
		
		</div>
			
		</section>

</body>
</html>
