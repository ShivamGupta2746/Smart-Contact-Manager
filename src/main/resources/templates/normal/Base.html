<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

	<link rel="stylesheet" th:href="@{/css/style.css}" />

    <title th:text="${title}">Base Html</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
  </head>
  <body>
    
            			<!-- Navbar Started  -->
            			
           
     <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
     
  <div class="container-fluid">
  
    <a class="navbar-brand" href="#">Smart Contact Manager</a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
    
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 text-uppercase">
      
        <li class="nav-item">
          <a class="nav-link active" aria-current="page"
          th:href="@{/}"
           href="">Home</a>
        </li>
          
       
        <li class="nav-item">
          <a class="nav-link" href="#" tabindex="-1" aria-disabled="true"><span th:text="${user.name}"></span></a>
        </li>
        
         <li class="nav-item">
          <a class="nav-link" href="" tabindex="-1"
          th:href="@{/logout}"
           aria-disabled="true">Logout</a>
        </li>
        
        
      </ul>
      
      
    </div>
  </div>
</nav>       			
            			
            			<!-- Navbar Ended -->
            			
            			<!-- Start The Side Bar -->
        
        <div class="sidebar">
        		<span onclick="toggleSidebar()" class="crossBtn">&times;</span>
        
        		<a id="home-link" href="#" th:href="@{/user/index}" class="item"><i class="fa-solid fa-house"></i>Home</a>
        		<a id="contacts-link" href="#" th:href="@{/user/show-contacts/0}" class="item"><i class="fa-solid fa-id-card"></i>View Contact</a>
        		<a id="add-link" href="#" th:href="@{/user/add-contact}" class="item"><i class="fa-solid fa-pencil"></i>Add Contact</a>
        		<a id="profile-link" href="#" th:href="@{/user/profile}" class="item"><i class="fa-solid fa-circle-user"></i>Profile</a>
        		<a id="settings-link" href="#" th:href="@{/user/settings}" class="item"><i class="fa-solid fa-cogs"></i>Settings</a>
        		<a href="#" th:href="@{/logout}" class="item"><i class="fa-solid fa-sign-out"></i>Logout</a>
        
        <div class="divider">
        
        </div>
        
        </div>    			
            			
            			<!-- End The Side Bar -->
            			
          		 <!--	Start the content area  -->	
          		 
         <div class="content mt-5">
         
         	<i onclick="toggleSidebar()" class="fas fa-bars m-3 "></i>
         
         		  <div th:if="${session.message}" class="container">
         			<div th:classappend="${'alert-'+session.message.type}" class="alert text-center" role="alert">
 			 
 			 <span th:text="${session.message.content}"></span>
 			 
					</div>
					
					<!-- Remove the message from session  -->
					<th:block th:text="${@sessionHelper.removeMessage()}"></th:block>
					
         		</div>
         		 
         		 
         		 
         		<div th:replace="${content}">
         		
         		
         </div> 		 	
 
    </div>
               <!--	End the content area  -->	
    

    <!-- Optional JavaScript; choose one of the two! -->
    
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
	<script>
	   function deleteContact(cid){
			swal({
						  title: "Are you sure?",
						  text: "You want to delete this contact !!",
						  icon: "warning",
						  buttons: true,
						  dangerMode: true,
						})
						.then((willDelete) => {
						  if (willDelete) {
						    window.location="/user/delete/"+cid;
						  } else {
						    swal("Your contact is safe!");
						  }
						});  
		 }
	
	</script>



	<!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
 	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
 	
       <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
 	
	<script th:src="@{/js/script.js}" ></script>
	

    <!-- Option 2: Separate Popper and Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->
  </body>
</html>
